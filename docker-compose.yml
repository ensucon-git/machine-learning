# Runs the controller as a service on its own machine, talking to Home
# Assistant over the LAN. See INSTALL.md for the full walkthrough.
#
#   docker compose up -d
#   docker compose exec hpmpc hpmpc check
#
services:
  hpmpc:
    build: .
    image: hpmpc:latest
    container_name: hpmpc
    restart: unless-stopped
    environment:
      # Where Home Assistant is. Use an IP address: .local names are mDNS and a
      # container has no resolver for them, so they fail here even though they
      # work in your browser.
      HA_URL: ${HA_URL:-http://192.168.1.42:8123}
      # Long-lived access token from your Home Assistant profile page.
      HA_TOKEN: ${HA_TOKEN:?set HA_TOKEN in .env}
      # Optional, and unrelated to Home Assistant: it protects hpmpc's own HTTP
      # API on port 8129.
      HPMPC_API_KEY: ${HPMPC_API_KEY:-}
      # Local time matters: electricity prices, the base-load profile and the
      # holiday schedule are all wall-clock things.
      TZ: ${TZ:-Europe/Stockholm}
    volumes:
      - ./config:/config
      - hpmpc-data:/data
    ports:
      - "${HPMPC_PORT:-8129}:8129"

  # Nightly snapshots of /data and the config to another disk - a NAS share
  # mounted on this host. Off unless COMPOSE_PROFILES=backup is in .env. It is
  # a separate container on purpose: a network share that stops answering can
  # hang whatever touches it, and that must never be the control loop.
  #
  #   BACKUP_DIR=/mnt/nfs/docker-volumes/hpmpc   (in .env)
  #   COMPOSE_PROFILES=backup                    (in .env)
  #   docker compose up -d
  #   docker compose exec hpmpc-backup hpmpc backup --to /backup   # one now
  hpmpc-backup:
    image: hpmpc:latest
    container_name: hpmpc-backup
    profiles: ["backup"]
    restart: unless-stopped
    depends_on: [hpmpc]
    environment:
      TZ: ${TZ:-Europe/Stockholm}
    # After the nightly retrain (03:00), so the snapshot carries the new model.
    command: ["backup", "--to", "/backup", "--daily-at", "${BACKUP_AT:-04:15}"]
    volumes:
      - ./config:/config:ro
      - hpmpc-data:/data:ro
      - ${BACKUP_DIR:-./backup}:/backup
    healthcheck:
      # Unhealthy when the newest snapshot is more than 30 h old - the share
      # unmounted, full or refusing writes.
      test: ["CMD", "hpmpc", "backup", "--to", "/backup", "--check"]
      interval: 1h
      timeout: 30s
      start_period: 10m
      retries: 1

volumes:
  hpmpc-data:
