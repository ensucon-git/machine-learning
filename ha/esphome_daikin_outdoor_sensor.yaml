# ---------------------------------------------------------------------------
# ESP32-C3 outdoor-sensor proxy for a Daikin Altherma
# (ERLQ016CAW1 outdoor unit + EHVH16S26CB9W hydrobox)
#
# Written for the hardware actually in use here:
#
#   Waveshare ESP32-C3-Zero-M      18 pins, 9 per row
#   2 x MCP41100 in series         8-bit, 100 kohm each -> 0..200 kohm
#   74HCT125                       3.3 V -> 5 V buffer on the four SPI lines
#   20 kohm 1% + 1 kohm + 100 nF   divider that reads the real outdoor sensor
#
# Two ways to drive this node:
#
#   a) Home Assistant converts the fictitious temperature to a wiper position
#      and writes it here - the HA package ships the template sensors for that,
#      and the curve then lives where you can adjust it against the pump's
#      display; or
#   b) hpmpc writes the wiper position straight here
#      (entities.wiper_output), owning both the NTC curve and the pot geometry.
#
#
# WHICH SENSOR TO FAKE - read this first, it matters more than the wiring
# ---------------------------------------------------------------------------
# The obvious target is R1T, the ambient thermistor in the outdoor unit. It is
# also the wrong one. R1T does not only feed the weather-dependent curve: the
# unit uses it for defrost timing, for operating-range limits, and for deciding
# when it may run at all. Lying to it means lying to all of that.
#
# The Daikin indoor unit can instead take its own EXTERNAL OUTDOOR SENSOR
# (accessory KRCS01-1, mounted outdoors) and be told by field setting to use
# that sensor for the weather-dependent curve, while the outdoor unit keeps its
# real R1T for defrost and protection. That is the sensor to emulate: same
# effect on the heating curve, none of the side effects.
#
# Look up the field setting in YOUR installer manual - the code differs between
# Altherma generations, and guessing at it is not something to do to a heat
# pump.
#
#
# SUPPLY RAILS - the one wiring mistake that destroys hardware
# ---------------------------------------------------------------------------
# The pump's sensor terminals measure 4.97 V open circuit. Its excitation is a
# pull-up from that rail, so the potentiometer's terminals can approach 4.97 V
# whenever the chain sits high. MCP41100 terminals must never exceed its own
# VDD, so:
#
#   U1, U2, U3   ->  +5 V, taken straight from the screw terminal, NOT from the
#                    module's 5V pin (some Zero boards drop a diode there and
#                    deliver 4.6 V, which is below the pump's rail).
#   divider, module -> 3.3 V from the module's own regulator.
#
# At VDD = 5 V the MCP41100 wants 3.5 V to read a one (0.7 x VDD) and the C3
# gives 3.3 V. That is why the 74HCT125 is here and not optional: TTL inputs
# accept anything over 2.0 V, CMOS outputs swing to 5 V. It must be HCT or
# AHCT - a plain 74HC125 has the same 0.7 x VDD threshold and solves nothing.
#
# Nothing brings 5 V back to the C3: MCP41100 has no output, so the bus is
# one-way.
#
#
# PIN MAP - chosen from where the pins SIT, not only what they can do
# ---------------------------------------------------------------------------
# The C3-Zero puts 5V, GND, 3V3 and all five ADC pins in one row and the SPI
# pins in the other. Lay the module on its side with USB-C facing the board
# edge: power and the analog cluster then land in one end of the module and all
# four digital lines in the other.
#
#   pin 1  5V         supply in
#   pin 2  GND
#   pin 3  3V3 (out)  divider excitation and the CS pull-ups
#   pin 4  GPIO0      ADC_IN      - ADC1_CH0, and next door to 3V3 and GND
#   pin 5  GPIO1      relay drive - reserved, see STAGE 2 below
#   pin 8  GPIO4      CS1         -> U3 pin 9
#   pin 9  GPIO5      CS2         -> U3 pin 12
#   pin 10 GPIO6      SPI_CLK     -> U3 pin 2
#   pin 11 GPIO7      SPI_SI      -> U3 pin 5
#
# Four pins per row are unusable and none of them is obvious:
#   GPIO2, GPIO8   strapping, must be high at boot
#   GPIO9          the BOOT button is wired to it
#   GPIO10         the on-board WS2812
#   GPIO18/19      USB D-/D+
#   GPIO20/21      UART0
#
#
# RANGE: two MCP41100 in series
# ---------------------------------------------------------------------------
# A Daikin 20 kohm outdoor thermistor spans roughly 25 kohm at +20 C to
# 197 kohm at -20 C. One MCP41100 covers 0-100 kohm and runs out at about
# -7.4 C - the pot sits at its end stop, the pump is shown -7 C on a -15 C day,
# and the house underheats with nothing anywhere to say why.
#
# Two in series reach -20.3 C at the same 392 ohm step: series devices buy
# range, not resolution. Set pot.devices: 2 and heat_pump.perceived_min_c: -20
# in config.yaml to match, and check with 'hpmpc ntc-table'.
#
#
# WHAT HAPPENS WHEN THINGS FAIL
# ---------------------------------------------------------------------------
# This node is the pump's outdoor sensor. There is no thermistor behind the
# emulator, so an open circuit is not a safe state - it is a sensor fault.
# Every layer therefore falls back to a PLAUSIBLE RESISTANCE.
#
#   1. hpmpc alive          -> the optimised offset.
#   2. hpmpc silent, HA up  -> the dead-man automation writes the real outdoor
#                              temperature with offset zero, so the pump's own
#                              weather curve runs unmodified.
#   3. HA silent too        -> this node holds its last commanded position and
#                              keeps rewriting it. Outdoor temperature moves
#                              slowly; a value a few hours old is a far better
#                              sensor than none.
#   4. Held too long        -> FAILSAFE_WIPER below, a fixed position chosen to
#                              be cold enough to keep the house warm and mild
#                              enough not to cook it in summer.
#   5. ESP unpowered        -> the MCP41100 resistor tracks are passive, and
#                              PA0 is strapped to PW0 on each device, so the
#                              pump sees roughly 200 kohm - about -20 C. Wrong,
#                              but a reading rather than a sensor fault. Verify
#                              it with a multimeter at commissioning: pull the
#                              board's power and measure across J2.
#
# Layer 5 is the weak one. In winter -20 C is roughly what you would have
# wanted anyway; in the shoulder season it means the pump heats flat out until
# someone notices. Two mitigations, in order of cost:
#
#   - Alarm on binary_sensor.varmepump_proxy_online below. It goes off the
#     moment the node stops answering, and the failure that matters here - the
#     board losing power while the pump runs - is by definition one where Home
#     Assistant and the network are still up.
#   - STAGE 2: two DPDT signal relays that hand the pump the REAL outdoor
#     sensor instead. See docs/HARDWARE.md.
#
#
# NO READBACK - why the wiper is rewritten on a timer
# ---------------------------------------------------------------------------
# The 8-pin MCP41100 has no output. The wiper sensor below reports this node's
# own variable, that is, what the ESP believes it sent - nothing anywhere can
# say what the chip actually holds. A single mislatched bit would therefore be
# a silent, permanent error, and with the spill-over below a bad byte on the
# second device is worth up to 100 kohm.
#
# So the 30 s interval below rewrites the same value over and over. A mislatched bit then
# heals itself within half a minute, and the pump filters its outdoor reading
# over hours, so half a minute barely moves the leaving water temperature.
# ---------------------------------------------------------------------------

esphome:
  name: varmepump-proxy
  friendly_name: Varmepump proxy

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

# GPIO20/21 carry UART0 and are deliberately left alone; the C3 logs over its
# native USB serial/JTAG, so the console survives even with the header full.
logger:

api:
  encryption:
    key: !secret api_encryption_key
ota:
  - platform: esphome
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # If Wi-Fi drops the node keeps running; the watchdog below hands the pump a
  # safe position rather than freezing on a stale value for ever.
  reboot_timeout: 0s

# The alarm that stands in for the stage-2 relay. Trigger a notification in
# Home Assistant on this going 'off' for ten minutes - and if you have any way
# to switch the pump off from HA, do that instead of only notifying.
binary_sensor:
  - platform: status
    name: "Online"

spi:
  clk_pin: GPIO6
  mosi_pin: GPIO7
  # No miso_pin: MCP41100 is write-only. Nothing 5 V ever reaches the C3.

# MCP41100. 16 bits per transfer: command byte then wiper byte.
# 0x11 = write data to potentiometer 0. Mode 0,0.
# Both chip selects go through the 74HCT125, and both carry a 4k7 pull-up to
# 3V3 on the buffer's INPUT side so the chips stay deselected while the module
# boots and its GPIOs are still high-impedance.
spi_device:
  - id: pot_primary
    cs_pin: GPIO4
    data_rate: 1MHz
    mode: 0
  - id: pot_secondary
    cs_pin: GPIO5
    data_rate: 1MHz
    mode: 0

globals:
  - id: wiper_position
    type: int
    restore_value: false
    initial_value: '-1'
  - id: last_command_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'

script:
  # Hardware write only. Deliberately does NOT stamp last_command_ms, so the
  # periodic refresh cannot reset the watchdog clock and hide a silent network.
  - id: write_pots
    parameters:
      step: int
    then:
      - lambda: |-
          // Two devices in series: the first fills to 255, the rest spills into
          // the second. Total range 0..510.
          const int PER_DEVICE = 255;
          int a = step > PER_DEVICE ? PER_DEVICE : step;
          int b = step > PER_DEVICE ? step - PER_DEVICE : 0;

          uint8_t frame[2] = {0x11, (uint8_t) a};
          id(pot_primary)->enable();
          id(pot_primary)->write_array(frame, 2);
          id(pot_primary)->disable();

          uint8_t frame2[2] = {0x11, (uint8_t) b};
          id(pot_secondary)->enable();
          id(pot_secondary)->write_array(frame2, 2);
          id(pot_secondary)->disable();

  - id: set_wiper
    parameters:
      step: int
    then:
      - lambda: |-
          // Independent sanity band. hpmpc already clamps what the pump may be
          // shown, and so does Home Assistant, but the firmware must not trust
          // the network: a corrupted value must not reach the pump.
          const int STEP_MIN = 0;
          const int STEP_MAX = 510;      // 255 per device, two in series
          if (step < STEP_MIN || step > STEP_MAX) {
            ESP_LOGW("hpmpc", "Rejected out-of-band wiper %d", step);
            return;
          }
          id(write_pots)->execute(step);
          id(wiper_position) = step;
          id(last_command_ms) = millis();

number:
  # Two ways in. Use whichever suits you and ignore the other; they end up in
  # the same place.
  #
  #   Simulerad utetemperatur - this node owns the NTC table. The Home
  #                        Assistant package writes the fictitious temperature
  #                        straight here; one table, one place to fix it.
  #                        This is the default.
  #   Wiper target       - Home Assistant owns the table instead, so you can
  #                        trim it against the pump's display without
  #                        reflashing - at the cost of two tables that have to
  #                        agree with each other.
  - platform: template
    name: "Wiper target"
    id: wiper_target
    unit_of_measurement: "step"
    min_value: 0
    max_value: 510
    step: 1
    optimistic: true
    set_action:
      - script.execute:
          id: set_wiper
          step: !lambda "return (int) x;"

  # -> number.varmepump_proxy_simulerad_utetemperatur, which is what the Home
  # Assistant package writes to. Rename both together or neither.
  - platform: template
    name: "Simulerad utetemperatur"
    id: target_temperature
    unit_of_measurement: "°C"
    device_class: temperature
    min_value: -20            # two devices reach -20.3 C; below that they clamp
    max_value: 30
    step: 0.1
    optimistic: true
    set_action:
      - lambda: |-
          // Temperature -> resistance -> wiper, with the same table the
          // readback sensor uses. Keep both identical to the ntc: section of
          // config.yaml.
          static const float T[] = {-30,-25,-20,-15,-10,-5,0,5,10,15,20,25,30};
          static const float R[] = {347667,260639,196648,149283,114003,87562,
                                    67628,52514,40991,32159,25354,20084,15984};
          const int N = 13;
          float t = x;
          if (t <= T[0]) t = T[0];
          if (t >= T[N - 1]) t = T[N - 1];
          float ohm = R[N - 1];
          for (int i = 0; i < N - 1; i++) {
            if (t >= T[i] && t <= T[i + 1]) {
              float f = (t - T[i]) / (T[i + 1] - T[i]);
              ohm = R[i] + f * (R[i + 1] - R[i]);
              break;
            }
          }
          // Keep in step with pot: in config.yaml.
          const int DEVICES = 2;
          const float PER_STEP = 100000.0 / 255.0;
          const float WIPER_OHM = 100.0;
          int step = (int) lroundf((ohm - DEVICES * WIPER_OHM) / PER_STEP);
          if (step < 0) step = 0;
          if (step > 255 * DEVICES) step = 255 * DEVICES;
          ESP_LOGD("hpmpc", "%.1f C -> %.0f ohm -> wiper %d", x, ohm, step);
          id(set_wiper)->execute(step);

sensor:
  # ---- the real outdoor sensor -------------------------------------------
  # The pump's own thermistor now hangs on this board instead of on the pump,
  # which is what makes entities.outdoor_temp a measurement at the house rather
  # than an SMHI grid point.
  #
  # Divider: 3V3 -> sensor -> node -> 20k -> GND, with 1k and 100 nF at the pin.
  # That orientation matters. The other way round puts the whole winter above
  # 2.5 V where the C3's ADC saturates; this way cold reads LOW - 0.18 V at
  # -30 C, 1.83 V at +30 C, and 14-42 mV per kelvin across the range.
  - platform: adc
    pin: GPIO0                    # ADC1_CH0. ADC2 is unusable with Wi-Fi up.
    id: ntc_voltage
    attenuation: 12db             # '11db' on ESPHome older than 2023.12
    update_interval: 500ms
    filters:
      # A median, not a mean: Wi-Fi transmit bursts pull the 3.3 V rail down for
      # a few milliseconds at a low duty cycle, and a median throws those away
      # while an average folds them in. One value every 7.5 s.
      - median:
          window_size: 15
          send_every: 15

  - platform: resistance
    sensor: ntc_voltage
    id: ntc_resistance
    configuration: UPSTREAM       # the thermistor is the upstream leg
    resistor: 20kOhm
    reference_voltage: 3.3V

  - platform: ntc
    sensor: ntc_resistance
    name: "Verklig utetemperatur"
    id: real_outdoor
    device_class: temperature
    accuracy_decimals: 1
    calibration:                  # same three points as the ntc: table above
      - 196648Ohm -> -20°C
      - 67628Ohm -> 0°C
      - 20084Ohm -> 25°C
    filters:
      # The C3's ADC carries a percent or two of per-chip offset and gain. That
      # is the dominant error here and it is not self-correcting, because this
      # reading does not go to the pump - trim it once against a reference
      # thermometer and put the result here.
      - calibrate_linear:
          - 0.0 -> 0.0
          - 20.0 -> 20.0

  # ---- what we are driving the pot to ------------------------------------
  # Set entities.pot_wiper to this. Without the pump's own reading it is the
  # only thing that says the write arrived - and, more useful, the only thing
  # that says the pot hit an end stop and clamped instead of applying what was
  # asked for.
  #
  # The name still says 0-255 because that is the entity id already in use in
  # Home Assistant and in config.yaml. With two devices the value spans 0-510.
  - platform: template
    name: "MCP41100 wiper (0-255)"
    id: mcp41100_wiper
    accuracy_decimals: 0
    lambda: |-
      if (id(wiper_position) < 0) return {};
      return (float) id(wiper_position);
    update_interval: 30s

  - platform: template
    name: "Emulated outdoor temperature"
    id: emulated_outdoor
    unit_of_measurement: "°C"
    device_class: temperature
    accuracy_decimals: 2
    lambda: |-
      // Inverse of the NTC table, so Home Assistant shows what the pump believes
      // rather than a raw wiper position nobody can read at a glance. Keep these
      // arrays identical to the ntc section of config.yaml.
      static const float T[] = {-30,-25,-20,-15,-10,-5,0,5,10,15,20,25,30};
      static const float R[] = {347667,260639,196648,149283,114003,87562,
                                67628,52514,40991,32159,25354,20084,15984};
      const int N = 13;
      if (id(wiper_position) < 0) return {};
      // Keep in step with pot: in config.yaml.
      const int DEVICES = 2;
      const float PER_STEP = 100000.0 / 255.0;
      const float WIPER_OHM = 100.0;
      float r = id(wiper_position) * PER_STEP + DEVICES * WIPER_OHM;
      if (r <= 0) return {};
      // R decreases as T increases, so walk down.
      for (int i = 0; i < N - 1; i++) {
        if (r <= R[i] && r >= R[i + 1]) {
          float f = (r - R[i]) / (R[i + 1] - R[i]);
          return T[i] + f * (T[i + 1] - T[i]);
        }
      }
      return r > R[0] ? T[0] : T[N - 1];
    update_interval: 30s

interval:
  # Refresh: rewrite the same value the pots should already hold. See NO
  # READBACK above - this is what turns a mislatched bit from a permanent error
  # into a 30 second one.
  - interval: 30s
    then:
      - lambda: |-
          if (id(wiper_position) >= 0) {
            id(write_pots)->execute(id(wiper_position));
          }

  # Watchdog: the layer that survives Home Assistant and hpmpc both dying.
  #
  # It holds the last commanded position for a few hours - outdoor temperature
  # moves slowly - and only then falls to a fixed safe position. There is no
  # relay to release in stage 1, and releasing one would be wrong anyway while
  # the emulator is the pump's only sensor.
  #
  # FAILSAFE_WIPER is that position: with two devices, wiper 172 is about
  # 68 kohm, which a Daikin 20 kohm curve reads as 0 C. Cold enough that the
  # house stays warm through a winter outage, mild enough that a summer outage
  # does not run the pump flat out. Recompute it for your own curve with
  # 'hpmpc ntc-table'.
  - interval: 60s
    then:
      - lambda: |-
          const uint32_t HOLD_MS   = 4 * 60 * 60 * 1000UL;   // trust the last value this long
          const int FAILSAFE_WIPER = 172;                    // ~0 C
          static bool announced = false;
          if (id(last_command_ms) == 0) return;              // never commanded yet
          uint32_t quiet = millis() - id(last_command_ms);
          if (quiet > HOLD_MS && id(wiper_position) != FAILSAFE_WIPER) {
            ESP_LOGW("hpmpc", "No command for %u min - driving the failsafe position",
                     quiet / 60000U);
            id(set_wiper)->execute(FAILSAFE_WIPER);
            // set_wiper stamps last_command_ms, so hold the original stamp to
            // keep reporting the real silence rather than resetting the clock.
            id(last_command_ms) = millis() - HOLD_MS;
            announced = true;
          } else if (quiet > 30 * 60 * 1000UL && !announced) {
            ESP_LOGW("hpmpc", "No command for %u min - holding the last position",
                     quiet / 60000U);
            announced = true;
          }


# ---------------------------------------------------------------------------
# COMMISSIONING - the order matters, each step catches its own class of error
#
# 1. Power the board with EMPTY sockets. Measure between pin 8 and pin 4 of the
#    MCP sockets, and between pin 14 and pin 7 of the U3 socket: 5 V, not 3.3.
#    Wiring VDD to the wrong rail is the one mistake that can destroy both the
#    chips and the pump's input.
# 2. Fit U3 alone. Toggle CS1 and CS2 and measure U3 pins 8 and 11: they must
#    swing 0 to 5 V, and rest at 5 V thanks to the pull-ups. 3.3 V out means you
#    have an HC where an HCT belongs.
# 3. Fit the pots. Do NOT connect the pump yet. Command a few positions and
#    measure across J2 with a multimeter:
#       wiper   0 -> ~0.2 kohm      wiper 255 -> ~100 kohm
#       wiper 128 -> ~50 kohm       wiper 510 -> ~200 kohm
#    The MCP41100 is a +/-20% part. Put what you MEASURED into pot.resistance_ohm
#    and pot.wiper_ohm, and set pot.devices: 2.
# 4. Pull the board's power and measure across J2 again: about 200 kohm through
#    the passive tracks, thanks to the PA0-to-PW0 straps. An open circuit here
#    means the straps are wrong, and a dead board would be a sensor fault on the
#    pump instead of a cold lie.
# 5. Feed a known resistor across J1 in place of the sensor and check the ADC
#    chain: 20 kohm -> 1.650 V, 68 kohm -> 0.750 V, 200 kohm -> 0.300 V.
# 6. Connect the pump with control.dry_run: true and offset 0. The pump's own
#    display should read the real outdoor temperature. If it does not, the
#    calibration is wrong - fix it before going further, see docs/HARDWARE.md.
# 7. Command a steady -2 K offset for a day and check that the leaving water
#    temperature rises by about slope * 2 K. Only then let the controller run.
# ---------------------------------------------------------------------------
