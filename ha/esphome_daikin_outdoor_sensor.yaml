# ---------------------------------------------------------------------------
# ESP32 outdoor-sensor emulator for a Daikin Altherma
# (ERLQ016CAW1 outdoor unit + EHVH16S26CB9W hydrobox)
#
# Written for the hardware actually in use here: one MCP41100 (8-bit, 100 kohm,
# SPI). Read the RANGE section below before trusting it through a winter.
#
# Two ways to drive this node:
#
#   a) Home Assistant converts the fictitious temperature to a wiper position
#      and writes it here - the HA package ships the template sensors for that,
#      and the curve then lives where you can adjust it against the pump's
#      display; or
#   b) hpmpc writes the wiper position straight here
#      (entities.wiper_output), owning both the NTC curve and the pot geometry.
#
#
# WHICH SENSOR TO FAKE - read this first, it matters more than the wiring
# ---------------------------------------------------------------------------
# The obvious target is R1T, the ambient thermistor in the outdoor unit. It is
# also the wrong one. R1T does not only feed the weather-dependent curve: the
# unit uses it for defrost timing, for operating-range limits, and for deciding
# when it may run at all. Lying to it means lying to all of that.
#
# The Daikin indoor unit can instead take its own EXTERNAL OUTDOOR SENSOR
# (accessory KRCS01-1, mounted outdoors) and be told by field setting to use
# that sensor for the weather-dependent curve, while the outdoor unit keeps its
# real R1T for defrost and protection. That is the sensor to emulate: same
# effect on the heating curve, none of the side effects.
#
# Look up the field setting in YOUR installer manual - the code differs between
# Altherma generations, and guessing at it is not something to do to a heat
# pump. Search the manual for "external outdoor sensor" / "ambient sensor".
#
# If you do end up on R1T anyway, keep control.offset_min/offset_max small
# (about +/- 4 K) and keep heat_pump.perceived_min_c well above the unit's
# -25 C operating limit, so the lie never reaches a threshold that matters.
#
#
# RANGE: what one MCP41100 can and cannot do
# ---------------------------------------------------------------------------
# A Daikin 20 kohm outdoor thermistor spans roughly 25 kohm at +20 C to
# 197 kohm at -20 C. One MCP41100 covers 0-100 kohm, so:
#
#     hpmpc ntc-table --low -20 --high 20
#
#       temp (C)         ohm   wiper     K per 392 ohm
#          -20.0      196648      --      <- out of the pot's range
#          -10.0      114003      --      <- out of the pot's range
#           -5.0       87562     223             0.074
#            0.0       67628     172             0.098
#           10.0       40991     104             0.170
#           20.0       25354      64             0.288
#
# RESOLUTION is fine - 0.10 K per step around freezing, well under the 0.2 K
# where quantisation starts to show. RANGE is not: the coldest temperature this
# pot can present is about -7.4 C.
#
# That is a real problem below -7 C outdoors, and not a subtle one. The pot sits
# at wiper 255, the pump is shown -7 C on a -15 C day, and the house underheats
# with nothing anywhere to say why. Two things to do about it:
#
#   - set heat_pump.perceived_min_c to -7 so the controller never plans an
#     offset it cannot deliver ('hpmpc check' warns when these disagree); and
#   - before real cold, wire a SECOND MCP41100 in series and set pot.devices: 2.
#     That reaches -20 C at the same 392 ohm step - series devices buy range,
#     not resolution. Drive the second one from the spill-over in set_wiper()
#     below.
#
# A fixed resistor in series (pot.series_ohm) shifts the whole band colder for
# the price of the warm end - but holiday mode lives at the warm end, so prefer
# the second pot.
#
# SAFETY, WITH NO SENSOR BEHIND THE EMULATOR
# ---------------------------------------------------------------------------
# This node is the pump's outdoor sensor. There is no thermistor behind it to
# fall back to, which changes what "safe" means: an open circuit is not a safe
# state, it is a sensor fault. Every layer here therefore falls back to a
# PLAUSIBLE RESISTANCE, never to nothing.
#
#   1. hpmpc alive          -> the optimised offset.
#   2. hpmpc silent, HA up  -> the dead-man automation writes the real outdoor
#                              temperature with offset zero, so the pump's own
#                              weather curve runs unmodified.
#   3. HA silent too        -> this node holds its last commanded position. The
#                              outdoor temperature moves slowly; a value a few
#                              hours old is a far better sensor than none.
#   4. Held too long        -> it drives FAILSAFE_WIPER below, a fixed position
#                              chosen to be cold enough to keep the house warm
#                              and mild enough not to cook it in summer.
#   5. ESP unpowered        -> the relay drops to its NC contact. Wire a FIXED
#                              RESISTOR there, sized for the same temperature as
#                              FAILSAFE_WIPER (about 68 kohm for 0 C on a Daikin
#                              20 kohm curve, 1% metal film). That is the only
#                              layer that survives the ESP losing power, and it
#                              costs one resistor.
#
# If you have not fitted that resistor yet, leave the relay permanently
# energised and know that a dead ESP means a sensor fault on the pump.
# ---------------------------------------------------------------------------

esphome:
  name: varmepump-proxy
  friendly_name: Varmepump proxy

esp32:
  board: esp32dev

logger:
api:
  encryption:
    key: !secret api_encryption_key
ota:
  - platform: esphome
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # If Wi-Fi drops the node keeps running; the watchdog below hands the pump
  # back to its real sensor rather than freezing on a stale value.
  reboot_timeout: 0s

spi:
  clk_pin: GPIO18
  mosi_pin: GPIO23
  miso_pin: GPIO19

# MCP41100. 16 bits per transfer: command byte then wiper byte.
# 0x11 = write data to potentiometer 0. Mode 0,0.
spi_device:
  - id: pot_primary
    cs_pin: GPIO5
    data_rate: 1MHz
    mode: 0
  # A second device wired in series goes here; see set_wiper() below.
  # - id: pot_secondary
  #   cs_pin: GPIO17
  #   data_rate: 1MHz
  #   mode: 0

globals:
  - id: wiper_position
    type: int
    restore_value: false
    initial_value: '-1'
  - id: last_command_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'

script:
  - id: set_wiper
    parameters:
      step: int
    then:
      - lambda: |-
          // Independent sanity band. hpmpc already clamps what the pump may be
          // shown, and so does Home Assistant, but the firmware must not trust
          // the network: a corrupted value must not reach the pump.
          const int STEP_MIN = 0;
          const int STEP_MAX = 255;      // per device
          if (step < STEP_MIN || step > STEP_MAX) {
            ESP_LOGW("hpmpc", "Rejected out-of-band wiper %d", step);
            return;
          }
          uint8_t frame[2] = {0x11, (uint8_t) step};
          id(pot_primary)->enable();
          id(pot_primary)->write_array(frame, 2);
          id(pot_primary)->disable();

          // With a second device in series, the first fills to 255 and the rest
          // spills into the second:
          //   int spill = step > 255 ? step - 255 : 0;
          //   uint8_t frame2[2] = {0x11, (uint8_t) spill};
          //   id(pot_secondary)->enable();
          //   id(pot_secondary)->write_array(frame2, 2);
          //   id(pot_secondary)->disable();

          id(wiper_position) = step;
          id(last_command_ms) = millis();
          // The pump has no other sensor, so the relay belongs on whenever we
          // have something to say. It only drops on loss of power, to whatever
          // fixed resistor is wired to its NC contact.
          if (!id(emulator_relay).state) {
            id(emulator_relay).turn_on();
          }

# Energise to put the potentiometer on the pump's sensor input; de-energise to
# fall through to whatever is on the relay's NC contact - which must be a fixed
# resistor, not an open circuit, because there is no thermistor any more.
#
# restore_mode: ALWAYS_ON so that a reboot comes back controlling rather than
# sitting on the fixed resistor waiting for someone to notice.
switch:
  - platform: gpio
    id: emulator_relay
    name: "Emulated outdoor sensor engaged"
    pin: GPIO25
    restore_mode: ALWAYS_ON

number:
  # Two ways in. Use whichever suits you and ignore the other; they end up in
  # the same place.
  #
  #   Simulerad utetemperatur - this node owns the NTC table. The Home
  #                        Assistant package writes the fictitious temperature
  #                        straight here; one table, one place to fix it.
  #                        This is the default.
  #   Wiper target       - Home Assistant owns the table instead, so you can
  #                        trim it against the pump's display without
  #                        reflashing - at the cost of two tables that have to
  #                        agree with each other.
  - platform: template
    name: "Wiper target"
    id: wiper_target
    unit_of_measurement: "step"
    min_value: 0
    max_value: 255
    step: 1
    optimistic: true
    set_action:
      - script.execute:
          id: set_wiper
          step: !lambda "return (int) x;"

  # -> number.varmepump_proxy_simulerad_utetemperatur, which is what the Home
  # Assistant package writes to. Rename both together or neither.
  - platform: template
    name: "Simulerad utetemperatur"
    id: target_temperature
    unit_of_measurement: "°C"
    device_class: temperature
    min_value: -25
    max_value: 30
    step: 0.1
    optimistic: true
    set_action:
      - lambda: |-
          // Temperature -> resistance -> wiper, with the same table the
          // readback sensor uses. Keep both identical to the ntc: section of
          // config.yaml.
          static const float T[] = {-30,-25,-20,-15,-10,-5,0,5,10,15,20,25,30};
          static const float R[] = {347667,260639,196648,149283,114003,87562,
                                    67628,52514,40991,32159,25354,20084,15984};
          const int N = 13;
          float t = x;
          if (t <= T[0]) t = T[0];
          if (t >= T[N - 1]) t = T[N - 1];
          float ohm = R[N - 1];
          for (int i = 0; i < N - 1; i++) {
            if (t >= T[i] && t <= T[i + 1]) {
              float f = (t - T[i]) / (T[i + 1] - T[i]);
              ohm = R[i] + f * (R[i + 1] - R[i]);
              break;
            }
          }
          const float PER_STEP = 100000.0 / 255.0;
          const float WIPER_OHM = 100.0;
          int step = (int) lroundf((ohm - WIPER_OHM) / PER_STEP);
          if (step < 0) step = 0;
          if (step > 255) step = 255;          // 255 * pot count, if you fit two
          ESP_LOGD("hpmpc", "%.1f C -> %.0f ohm -> wiper %d", x, ohm, step);
          id(set_wiper)->execute(step);

sensor:
  # The readback. Set entities.pot_wiper to this: without the pump's own
  # reading it is the only thing that says the write arrived - and, more
  # useful, the only thing that says the pot hit an end stop and clamped
  # instead of applying what was asked for.
  - platform: template
    name: "MCP41100 wiper (0-255)"
    id: mcp41100_wiper
    accuracy_decimals: 0
    lambda: |-
      if (id(wiper_position) < 0) return {};
      return (float) id(wiper_position);
    update_interval: 30s

  - platform: template
    name: "Emulated outdoor temperature"
    id: emulated_outdoor
    unit_of_measurement: "°C"
    device_class: temperature
    accuracy_decimals: 2
    lambda: |-
      // Inverse of the NTC table, so Home Assistant shows what the pump believes
      // rather than a raw wiper position nobody can read at a glance. Keep these
      // arrays identical to the ntc section of config.yaml.
      static const float T[] = {-30,-25,-20,-15,-10,-5,0,5,10,15,20,25,30};
      static const float R[] = {347667,260639,196648,149283,114003,87562,
                                67628,52514,40991,32159,25354,20084,15984};
      const int N = 13;
      if (id(wiper_position) < 0) return {};
      // Keep in step with pot: in config.yaml.
      const float PER_STEP = 100000.0 / 255.0;
      const float WIPER_OHM = 100.0;
      float r = id(wiper_position) * PER_STEP + WIPER_OHM;
      if (r <= 0) return {};
      // R decreases as T increases, so walk down.
      for (int i = 0; i < N - 1; i++) {
        if (r <= R[i] && r >= R[i + 1]) {
          float f = (r - R[i]) / (R[i + 1] - R[i]);
          return T[i] + f * (T[i + 1] - T[i]);
        }
      }
      return r > R[0] ? T[0] : T[N - 1];
    update_interval: 30s

interval:
  # Watchdog: the layer that survives Home Assistant and hpmpc both dying.
  #
  # It does NOT release the relay. With no thermistor behind the emulator that
  # would hand the pump an open circuit, which is worse than any stale value.
  # Instead it holds the last commanded position for a few hours - outdoor
  # temperature moves slowly - and only then falls to a fixed safe position.
  #
  # FAILSAFE_WIPER is that position: wiper 172 is about 68 kohm, which a Daikin
  # 20 kohm curve reads as 0 C. Cold enough that the house stays warm through a
  # winter outage, mild enough that a summer outage does not run the pump flat
  # out. Recompute it for your own curve with 'hpmpc ntc-table'.
  - interval: 60s
    then:
      - lambda: |-
          const uint32_t HOLD_MS   = 4 * 60 * 60 * 1000UL;   // trust the last value this long
          const int FAILSAFE_WIPER = 172;                    // ~0 C
          static bool announced = false;
          if (id(last_command_ms) == 0) return;              // never commanded yet
          uint32_t quiet = millis() - id(last_command_ms);
          if (quiet > HOLD_MS && id(wiper_position) != FAILSAFE_WIPER) {
            ESP_LOGW("hpmpc", "No command for %u min - driving the failsafe position",
                     quiet / 60000U);
            id(set_wiper)->execute(FAILSAFE_WIPER);
            // set_wiper stamps last_command_ms, so hold the original stamp to
            // keep reporting the real silence rather than resetting the clock.
            id(last_command_ms) = millis() - HOLD_MS;
            announced = true;
          } else if (quiet > 30 * 60 * 1000UL && !announced) {
            ESP_LOGW("hpmpc", "No command for %u min - holding the last position",
                     quiet / 60000U);
            announced = true;
          }


# ---------------------------------------------------------------------------
# COMMISSIONING
#
# 1. Do not connect the pump yet. Command a few wiper positions and measure the
#    output with a multimeter. The MCP41100 is a +/-20% part with tens of ohms
#    of wiper resistance - measure, do not assume, and put what you measure into
#    pot.resistance_ohm and pot.wiper_ohm.
# 2. Calibrate against the PUMP, not against the sensor. Connect the emulator,
#    command a position, and read what the pump's display says it means.
#    Repeat at two or three well-separated values:
#       hpmpc calibrate-ntc --point=-5.4:87500 --point=2.1:58000 --point=9.6:41000
#    Pairs taken this way include the wiring resistance, the connector and the
#    pump's own linearisation - all of which a bench measurement of the
#    thermistor misses. 'hpmpc check' prints a ready-made --point for whatever
#    the pot is set to right now.
# 3. Connect the pump with control.dry_run: true and offset 0. The pump's own
#    display should read the real outdoor temperature. If it does not, the
#    calibration is wrong - fix it before going further.
# 3b. Pull the ESP's power for a minute and read the display again. It should
#    show whatever the fixed resistor on the relay's NC contact represents. If
#    it shows an error, that resistor is missing - fit it.
# 4. Command a steady -2 K offset for a day and check that the leaving water
#    temperature rises by about slope * 2 K. Only then let the controller run.
# 5. Before the first real cold snap, decide about the second pot. Below -7 C
#    outdoors, one MCP41100 cannot tell this pump the truth.
# ---------------------------------------------------------------------------
