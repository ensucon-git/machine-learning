# ---------------------------------------------------------------------------
# Home Assistant package for hpmpc, wired for the Daikin + ESP32 setup.
#
# Put this in config/packages/heatpump_mpc.yaml and add to configuration.yaml:
#
#   homeassistant:
#     packages: !include_dir_named packages
#
# WHAT hpmpc WRITES, AND WHERE IT GOES
#
# hpmpc does not create entities of its own - it writes into the two helpers
# defined below, every control cycle:
#
#   input_number.varmepump_offset          the decision, in kelvin
#   input_number.varmepump_fiktiv_utetemp  real outdoor + offset, in degrees
#                                          == THE TEMPERATURE TO SHOW THE PUMP
#
# The second one is the one to act on. Point config.yaml at them:
#
#   entities:
#     offset_output: input_number.varmepump_offset
#     fake_temperature_output: input_number.varmepump_fiktiv_utetemp
#
# They stay at "unknown" until hpmpc's first cycle - that is normal on a fresh
# install, and "hpmpc plan" shows what would be written before that happens.
#
# From there the template sensors below turn the fictitious temperature into a
# resistance and a wiper position, so the sensor curve stays where you can trim
# it against the pump's display. If your firmware takes a temperature instead,
# see automation B) further down and skip the conversion entirely.
#
# READ THIS BEFORE CHANGING THE SAFETY NETS. The pump has no outdoor sensor of
# its own any more - the potentiometer IS its sensor. So there is no such thing
# as "release the emulator and let the pump read its own sensor": that leaves an
# open circuit. Every safety net here falls back to the TRUTH instead - offset
# zero and the real outdoor temperature - which makes the pump behave exactly
# as it would have without any of this.
# ---------------------------------------------------------------------------

input_boolean:
  varmepump_mpc_aktiv:
    name: MPC control active
    icon: mdi:robot

  hpmpc_dry_run:
    name: MPC dry run (calculate but do not act)
    icon: mdi:test-tube

  semesterlage:
    name: Holiday mode
    icon: mdi:bag-suitcase

input_select:
  varmepump_lage:
    name: Heat pump comfort mode
    icon: mdi:home-thermometer
    options:
      - normal
      - away
      - holiday
    initial: normal

input_datetime:
  hemkomst:
    name: Back home at
    has_date: true
    has_time: true
    icon: mdi:home-clock

# ---------------------------------------------------------------------------
# Settings you can change from a dashboard. Map them under runtime_overrides:
# in config.yaml and the controller reads them on its next cycle - no restart,
# no file editing. 'hpmpc settings' lists everything that can be mapped and the
# range each value is allowed to take; anything outside is ignored with a note
# rather than applied.
# ---------------------------------------------------------------------------
input_number:
  # ---------------------------------------------------------------------
  # What the controller writes. Both are the same decision in different units;
  # act on the one that suits your hardware and read the other on a dashboard.
  # ---------------------------------------------------------------------
  varmepump_offset:
    name: MPC offset
    min: -25
    max: 25
    step: 0.01
    unit_of_measurement: "K"
    icon: mdi:thermometer-lines
    mode: box

  varmepump_fiktiv_utetemp:
    name: MPC fictitious outdoor temperature
    min: -40
    max: 40
    step: 0.01
    unit_of_measurement: "°C"
    icon: mdi:thermometer
    mode: box

  eloverforing_kr_per_kwh:
    name: Grid transfer + energy tax
    min: 0
    max: 3
    step: 0.0001
    initial: 0.8855
    unit_of_measurement: "kr/kWh"
    icon: mdi:transmission-tower
    mode: box

  inne_borvarde:
    name: Indoor setpoint
    min: 15
    max: 26
    step: 0.1
    initial: 21
    unit_of_measurement: "°C"
    icon: mdi:home-thermometer
    mode: box

  # The band is relative to the setpoint, so moving the setpoint moves the
  # whole band. That is what makes holiday mode one number instead of four.
  komfort_under:
    name: Comfort band, degrees below setpoint
    min: 0
    max: 6
    step: 0.1
    initial: 0.7
    unit_of_measurement: "K"
    mode: box

  komfort_over:
    name: Comfort band, degrees above setpoint
    min: 0
    max: 6
    step: 0.1
    initial: 1.0
    unit_of_measurement: "K"
    mode: box

  offset_min:
    name: Most negative offset (more heat)
    min: -15
    max: 0
    step: 0.5
    initial: -6
    unit_of_measurement: "K"
    mode: box

  offset_max:
    name: Most positive offset (less heat)
    min: 0
    max: 15
    step: 0.5
    initial: 4
    unit_of_measurement: "K"
    mode: box

  effekttak_kw:
    name: Electrical power cap (0 = off)
    min: 0
    max: 40
    step: 0.5
    initial: 0
    unit_of_measurement: "kW"
    icon: mdi:fuse
    mode: box

  elpatron_avgift:
    name: Extra charge on backup heat
    min: 0
    max: 20
    step: 0.5
    initial: 0
    unit_of_measurement: "kr/kWh"
    icon: mdi:radiator
    mode: box

template:
  - sensor:
      # ===================================================================
      # EDIT THIS ONE FIRST. It is the real outdoor temperature, and it is
      # the only line in this file you have to point at your own entities.
      #
      # Every safety net here falls back to the truth rather than to
      # nothing, and this is where "the truth" comes from. Put your own
      # outdoor sensor first if you have one; otherwise any weather
      # integration will do - it only has to be roughly right.
      #
      # If none of them is available this stays unknown, and the fallbacks
      # deliberately hold the last value instead of inventing one. Writing
      # a made-up 0 C to a pump that has no other sensor is worse than
      # holding a reading from an hour ago.
      # ===================================================================
      - name: "Utegivare verklig"
        unique_id: hpmpc_real_outdoor
        unit_of_measurement: "°C"
        device_class: temperature
        state: >
          {% set candidates = [
               states('sensor.ute_temperatur'),
               state_attr('weather.forecast_home', 'temperature'),
               state_attr('weather.hemma', 'temperature') ] %}
          {% set found = candidates | reject('in', [none, 'unknown', 'unavailable']) | list %}
          {{ found[0] | float(none) if found else none }}

      # Your own calibration lives here: the curve that turns the fictitious
      # temperature into a resistance for the digital pot. Fit it against what
      # the pump's DISPLAY reads, not against a bench measurement of the
      # thermistor - the display includes the wiring, the connector and the
      # pump's own linearisation.
      #
      # This example is a 20 kohm / B=3950 NTC. Adjust R25 and B until commanding
      # a value makes the pump's display agree with it.
      #
      # Before hpmpc's first cycle - a fresh install, or the minutes after a
      # Home Assistant restart - the fictitious temperature is still unknown.
      # The pump needs a resistance anyway, so fall through to the real outdoor
      # temperature: that is offset zero, which is exactly right when nobody
      # has an opinion yet.
      - name: "Utegivare mAlresistans"
        unique_id: hpmpc_target_resistance
        unit_of_measurement: "Ω"
        state: >
          {% set t = states('input_number.varmepump_fiktiv_utetemp') | float(none) %}
          {# An input_number with no `initial:` starts at its MINIMUM, so before
             hpmpc has ever written to it this reads -40. That is not a
             temperature, it is "never set" - and taken literally it means about
             800 kohm, the pot's end stop, the coldest the pump can be shown, and
             therefore maximum heat. Anything outside the band the controller is
             allowed to command is treated as no value at all. #}
          {% if t is not none and (t <= -35 or t >= 35) %}
            {% set t = none %}
          {% endif %}
          {% if t is none %}
            {% set t = states('sensor.utegivare_verklig') | float(none) %}
          {% endif %}
          {% if t is none %}
            {{ none }}
          {% else %}
            {% set r25 = 20000 %}
            {% set beta = 3950 %}
            {{ (r25 * (2.718281828459045 ** (beta * (1/(t + 273.15) - 1/298.15)))) | round(0) }}
          {% endif %}

      # The same target as a wiper position.
      #
      # NOT IN THE CONTROL PATH with the shipped ESPHome config. Automation A)
      # below sends the fictitious TEMPERATURE straight to the node, and the
      # node owns the NTC table - so this sensor and the one above are only
      # consumed by automation B), which is commented out. They are kept for
      # the B) path and because they are readable on a dashboard.
      #
      # POTS must match what is actually wired. It is 2 here: two MCP41100 in
      # series, 0..510 taps, which is what it takes to reach -20 C on the curve
      # above. It was 1 while a single device was fitted.
      #
      # This CLAMPS, and that matters: a target beyond the last tap cannot be
      # applied, and rounding it to the end stop silently is how the pump ends up
      # being shown -7 C on a -15 C day. The sanity automation below watches for
      # exactly that.
      - name: "Utegivare wiper"
        unique_id: hpmpc_target_wiper
        unit_of_measurement: "step"
        state: >
          {% set r = states('sensor.utegivare_malresistans') | float(none) %}
          {% set pots = 2 %}
          {% if r is none %}
            {{ none }}
          {% else %}
            {% set step = 100000 / 255 %}
            {% set raw = ((r - 100 * pots) / step) | round(0) %}
            {{ [[raw, 0] | max, 255 * pots] | min }}
          {% endif %}

      # Minutes since the controller last reported in - drives the dead-man switch.
      - name: "MPC age"
        unique_id: hpmpc_age_minutes
        unit_of_measurement: "min"
        state_class: measurement
        state: >
          {% set updated = state_attr('sensor.hpmpc_status', 'updated') %}
          {{ ((as_timestamp(now()) - as_timestamp(updated)) / 60) | round(0) if updated else 9999 }}

      # What the controller is currently costing or saving, for the dashboard.
      - name: "MPC predicted saving"
        unique_id: hpmpc_predicted_saving
        unit_of_measurement: "%"
        state: "{{ state_attr('sensor.hpmpc_status', 'predicted_saving_pct') | float(0) }}"

      # Resistive backup heat the plan expects to need. Anything above zero for
      # long is worth investigating: it means the heating curve, the offset
      # limits or the pump sizing is being pushed past what the compressor can do.
      - name: "MPC backup heater in plan"
        unique_id: hpmpc_backup_heater
        unit_of_measurement: "kWh"
        state: "{{ state_attr('sensor.hpmpc_status', 'backup_heater_kwh_horizon') | float(0) }}"

      # What the split says the heat pump is drawing right now, for the energy
      # dashboard. Only meaningful once 'hpmpc train' has run.
      - name: "MPC heat pump share of house power"
        unique_id: hpmpc_heatpump_share
        unit_of_measurement: "%"
        state: "{{ (state_attr('sensor.hpmpc_status', 'heatpump_share') | float(0) * 100) | round(0) }}"

      - name: "MPC comfort mode"
        unique_id: hpmpc_mode
        icon: mdi:home-thermometer
        state: "{{ state_attr('sensor.hpmpc_status', 'mode') or 'unknown' }}"
        attributes:
          setpoint: "{{ state_attr('sensor.hpmpc_status', 'setpoint') }}"
          comfort_band: "{{ state_attr('sensor.hpmpc_status', 'comfort_band') }}"

      # The one closed-loop check on the actuator. A steady non-zero value means
      # the NTC table does not match what the pump is really reading.
      - name: "MPC actuator error"
        unique_id: hpmpc_actuator_error
        unit_of_measurement: "K"
        state_class: measurement
        state: "{{ state_attr('sensor.hpmpc_status', 'actuator_error_c') | float(0) }}"

      - name: "Heat pump perceived outdoor temperature"
        unique_id: hpmpc_perceived_outdoor
        unit_of_measurement: "°C"
        device_class: temperature
        state: "{{ states('input_number.varmepump_fiktiv_utetemp') }}"

  - binary_sensor:
      - name: "MPC healthy"
        unique_id: hpmpc_healthy
        device_class: problem
        state: >
          {{ states('sensor.mpc_age') | float(9999) > 45
             or states('sensor.varmepump_proxy_mcp41100_wiper_0_255') in ['unknown', 'unavailable'] }}

automation:
  # ---- Dead-man switch --------------------------------------------------
  # THE PUMP HAS NO SENSOR OF ITS OWN. The potentiometer is its outdoor sensor,
  # so "release the emulator" is not a safe state - it leaves the pump with an
  # open circuit or a stale value. Falling back means falling back to the TRUTH:
  # write the real outdoor temperature, offset zero, and let the pump's own
  # weather-dependent curve run exactly as it would have without any of this.
  #
  # A stuck faked temperature is the one failure that actually costs money or
  # comfort, so this runs regardless of why the controller went away. The ESP32
  # has its own watchdog with the same policy; the two are deliberately
  # independent.
  - alias: "MPC dead-man switch"
    id: hpmpc_deadman
    mode: single
    trigger:
      - platform: numeric_state
        entity_id: sensor.mpc_age
        above: 45
        for: "00:05:00"
      - platform: state
        entity_id: input_boolean.varmepump_mpc_aktiv
        to: "off"
    action:
      # Offset zero, and the fictitious temperature set to the real one. Use
      # your own outdoor sensor here if you have one; otherwise any weather
      # integration's current temperature will do - it only has to be roughly
      # right, and roughly right beats stale.
      - service: input_number.set_value
        target:
          entity_id: input_number.varmepump_offset
        data:
          value: 0
      # Only if we actually know the real temperature. If we do not, the
      # resistor keeps its last value, which is a far better sensor than a
      # number we made up.
      - if:
          - condition: template
            value_template: >
              {{ states('sensor.utegivare_verklig') | float(none) is not none }}
        then:
          - service: input_number.set_value
            target:
              entity_id: input_number.varmepump_fiktiv_utetemp
            data:
              value: "{{ states('sensor.utegivare_verklig') | float }}"
      - service: persistent_notification.create
        data:
          title: "Heat pump MPC"
          message: >
            The controller has not reported for {{ states('sensor.mpc_age') }} minutes.
            The pump is now being shown the real outdoor temperature with no offset,
            so its own heating curve runs unmodified.

  # ---- Sanity check on the faked temperature ----------------------------
  # Independent of anything hpmpc does: if what the pump is being shown drifts
  # implausibly far from the real outdoor temperature, stop the experiment.
  # The offset is the whole deviation from reality, so it is checked directly
  # rather than against an outdoor sensor - there need not be one, the real
  # outdoor temperature can come from SMHI inside the controller.
  #
  # Raise the limit if you run holiday mode, which legitimately needs about
  # twenty kelvin to coast down to 16 C in winter.
  - alias: "MPC offset sanity check"
    id: hpmpc_offset_sanity
    mode: single
    trigger:
      - platform: numeric_state
        entity_id: input_number.varmepump_offset
        above: 25
      - platform: numeric_state
        entity_id: input_number.varmepump_offset
        below: -10
    action:
      # Same policy as the dead-man switch: fall back to the truth, not to
      # nothing. Switching MPC off stops new offsets; the resistor keeps being
      # driven, because the pump has nothing else to read.
      - service: input_boolean.turn_off
        target:
          entity_id: input_boolean.varmepump_mpc_aktiv
      - service: input_number.set_value
        target:
          entity_id: input_number.varmepump_offset
        data:
          value: 0
      - if:
          - condition: template
            value_template: >
              {{ states('sensor.utegivare_verklig') | float(none) is not none }}
        then:
          - service: input_number.set_value
            target:
              entity_id: input_number.varmepump_fiktiv_utetemp
            data:
              value: "{{ states('sensor.utegivare_verklig') | float }}"
      - service: persistent_notification.create
        data:
          title: "Heat pump MPC stopped"
          message: >
            The controller asked for an offset of {{ states('input_number.varmepump_offset') }} K.
            MPC control is off and the pump is being shown the real outdoor temperature.

  # ---- The potentiometer ran out of range -------------------------------
  # Sitting at an end stop means the pump is shown something other than what was
  # asked for, with nothing in any log to say so - the house just drifts. This
  # says it out loud.
  #
  # THE END STOP DEPENDS ON HOW MANY DEVICES ARE WIRED: 255 for one MCP41100,
  # 510 for two in series. Two are fitted here, so it is 510.
  #
  # Watching 255 with two devices fitted would be actively wrong: 255 is then
  # the MIDDLE of the range, the point where the first device fills up and the
  # spill-over starts, and the wiper passes through it in ordinary operation
  # every time the weather crosses about -7 C.
  - alias: "MPC potentiometer at end stop"
    id: hpmpc_pot_end_stop
    mode: single
    trigger:
      - platform: state
        entity_id: sensor.varmepump_proxy_mcp41100_wiper_0_255
        to: "510"
        for: "00:30:00"
      - platform: state
        entity_id: sensor.varmepump_proxy_mcp41100_wiper_0_255
        to: "0"
        for: "00:30:00"
    action:
      - service: persistent_notification.create
        data:
          title: "Outdoor sensor emulator at its limit"
          message: >
            The potentiometer has been at wiper {{ states('sensor.varmepump_proxy_mcp41100_wiper_0_255') }}
            for half an hour. The controller wants to show the pump
            {{ states('input_number.varmepump_fiktiv_utetemp') }} °C but the hardware cannot reach it,
            so the pump is being shown something other than what was asked for.
            This is a range limit, not a fault. With two MCP41100 in series the chain
            spans about -20.3 to +30 C; check that heat_pump.perceived_min_c and
            perceived_max_c match, with 'hpmpc ntc-table'.

  # ---- Come home from holiday ------------------------------------------
  # The controller already ramps the comfort band back at the return time, and
  # decides for itself when to start reheating the slab - which for a deep
  # setback is many hours ahead. This just tidies up the switch afterwards so
  # the two do not disagree.
  - alias: "MPC leave holiday mode on arrival"
    id: hpmpc_return_home
    mode: single
    trigger:
      - platform: time
        at: input_datetime.hemkomst
    condition:
      - condition: state
        entity_id: input_boolean.semesterlage
        state: "on"
    action:
      - service: input_boolean.turn_off
        target:
          entity_id: input_boolean.semesterlage
      - service: input_select.select_option
        target:
          entity_id: input_select.varmepump_lage
        data:
          option: normal

  # ---- Push the target to the emulator ----------------------------------
  #
  # PICK THE ONE THAT MATCHES YOUR FIRMWARE, and delete the other. Both start
  # from input_number.varmepump_fiktiv_utetemp, which is what hpmpc writes:
  #
  #   A) your node takes a TEMPERATURE and owns the NTC table itself - this is
  #      the shipped ESPHome config, and the one enabled below.
  #   B) your node takes a WIPER POSITION, so Home Assistant owns the table:
  #      fictitious temperature -> sensor.utegivare_malresistans (ohm)
  #                             -> sensor.utegivare_wiper (0..255)
  #
  # A) keeps the conversion in one place. B) lets you trim the curve against
  # the pump's display without reflashing, at the cost of two tables that have
  # to agree - and 'hpmpc check' converts the wiper readback through hpmpc's
  # own pot:/ntc: sections, so a disagreement shows up there as a standing
  # actuator error rather than as anything obviously wrong.
  #
  # Note that hpmpc has already clamped the value to
  # heat_pump.perceived_min_c/max_c before it gets here. If the firmware still
  # has to clamp it, those settings do not match the hardware.
  #
  # --- A) temperature (default) ------------------------------------------
  - alias: "MPC to sensor emulator"
    id: hpmpc_to_emulator_temperature
    mode: single
    trigger:
      - platform: state
        entity_id: input_number.varmepump_fiktiv_utetemp
    condition:
      - condition: state
        entity_id: input_boolean.varmepump_mpc_aktiv
        state: "on"
      # Never push the never-written minimum: an input_number with no
      # `initial:` sits at -40 until hpmpc first writes, and -40 C is the
      # coldest the pump can be shown, which means maximum heat.
      - condition: template
        value_template: >
          {% set t = states('input_number.varmepump_fiktiv_utetemp') | float(none) %}
          {{ t is not none and -35 < t < 35 }}
    action:
      # Must match what your ESP node actually exposes - check Developer Tools
      # -> States for the number entity belonging to the varmepump_proxy node.
      - service: number.set_value
        target:
          entity_id: number.varmepump_proxy_simulerad_utetemperatur
        data:
          value: "{{ states('input_number.varmepump_fiktiv_utetemp') | float }}"

  # --- B) wiper position --------------------------------------------------
  # Uncomment this and delete A) if Home Assistant should own the NTC curve.
  #
  # - alias: "MPC to digital resistor"
  #   id: hpmpc_to_resistor
  #   mode: single
  #   trigger:
  #     - platform: state
  #       entity_id: sensor.utegivare_wiper
  #   condition:
  #     - condition: state
  #       entity_id: input_boolean.varmepump_mpc_aktiv
  #       state: "on"
  #     - condition: template
  #       value_template: "{{ states('sensor.utegivare_wiper') | float(-1) >= 0 }}"
  #   action:
  #     - service: number.set_value
  #       target:
  #         entity_id: number.varmepump_proxy_wiper_target
  #       data:
  #         value: "{{ states('sensor.utegivare_wiper') | int }}"

  # ---- Actuator calibration drift --------------------------------------
  # Everything about the offset is open loop except this. If what the pump
  # believes drifts from what was commanded, either the NTC table is wrong or
  # the hardware has changed - a wiper failing, a connector corroding.
  - alias: "MPC actuator calibration drift"
    id: hpmpc_actuator_drift
    mode: single
    trigger:
      - platform: numeric_state
        entity_id: sensor.mpc_actuator_error
        above: 1.5
        for: "02:00:00"
      - platform: numeric_state
        entity_id: sensor.mpc_actuator_error
        below: -1.5
        for: "02:00:00"
    action:
      - service: persistent_notification.create
        data:
          title: "Heat pump MPC"
          message: >
            The pump believes it is {{ states('sensor.mpc_actuator_error') }} K away from
            what the controller commanded. Either the NTC table does not match the sensor
            the pump reads, or something in the resistor chain has changed. Run
            'hpmpc check' - it prints a calibration pair you can feed straight to
            'hpmpc calibrate-ntc'.

  # ---- Backup heater warning -------------------------------------------
  - alias: "MPC backup heater warning"
    id: hpmpc_backup_warning
    mode: single
    trigger:
      - platform: numeric_state
        entity_id: sensor.mpc_backup_heater_in_plan
        above: 2
        for: "01:00:00"
    action:
      - service: persistent_notification.create
        data:
          title: "Heat pump MPC"
          message: >
            The plan expects {{ states('sensor.mpc_backup_heater_in_plan') }} kWh of
            resistive backup heat over the next 36 hours. That runs at COP 1. Check
            heat_pump.curve_slope, control.offset_min and whether the weather has
            simply gone past what the compressor can cover.
