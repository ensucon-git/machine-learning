# ---------------------------------------------------------------------------
# hpmpc - self-hosted MPC for an air/water heat pump on floor heating
#
# This example is filled in for a Daikin Altherma LT (ERLQ016CAW1 outdoor unit
# + EHVH16S26CB9W hydrobox) in Norrkoping, price area SE3. Change the entity
# ids to your own; everything else is commented so you can see what to adjust.
#
# Copy to config/config.yaml. Secrets come from the environment:
#   export HA_TOKEN=...
# ---------------------------------------------------------------------------

home_assistant:
  # Use the IP ADDRESS, not homeassistant.local, if hpmpc runs in Docker.
  # .local names are mDNS: your laptop resolves them through Bonjour or Avahi,
  # a container normally has neither, and the lookup fails inside the container
  # with "Temporary failure in name resolution" even though the same URL works
  # in your browser. Find the address under Settings -> System -> Network.
  base_url: ${HA_URL:-http://192.168.1.42:8123}

  # A long-lived access token from your Home Assistant profile page, under
  # Security. This is NOT the same thing as HPMPC_API_KEY, which protects
  # hpmpc's own HTTP API and is never sent to Home Assistant.
  token: ${HA_TOKEN}

  verify_ssl: true                  # false for a self-signed certificate on your LAN
  timeout: 30

# Only indoor_temp is strictly required. Everything else improves the model;
# leave unused entries empty and they are skipped.
entities:
  indoor_temp: sensor.hall_temperature_2          # required - mid-house is the right place

  # The REAL outdoor temperature. Empty on purpose: the current value comes from
  # the SMHI forecast instead, so no outdoor sensor is needed and Home Assistant
  # is not in the loop for it at all.
  #
  # To switch to your own sensor later, put its entity id here - it wins over
  # SMHI automatically, no other setting changes. A sensor at the house is the
  # better signal when you have one: it measures the air this building actually
  # loses heat to, rather than a 2.5 km grid square.
  outdoor_temp: ""
  price: ""                                       # only a fallback; see forecast.price_source

  wind_speed: ""                                  # m/s - from SMHI when empty
  cloud_cover: ""                                 # %, 0-100 - from SMHI when empty
  outdoor_humidity: ""                            # %, drives the defrost derate

  # What the pump itself reports as the outdoor temperature. This is the only
  # check that covers the WHOLE actuator chain - the resistor, the wiring, the
  # connector, the NTC table and the pump's own linearisation. Most Altherma
  # installations only show it on the unit's display, in which case leave this
  # empty and rely on pot_wiper below plus one calibration by eye.
  pump_outdoor_temp: ""
  solar_radiation: ""                             # W/m2 if you own a pyranometer
  weather: ""                                     # a HA weather entity, fallback if SMHI is down

  supply_temp: ""                                 # strongly recommended - transforms the fit
  return_temp: ""

  # A meter on the heat pump alone is the easy case. Leave it empty and the
  # pump's consumption is separated out of the whole-house measurement instead;
  # see the power: section below.
  heatpump_power: ""

  # Victron whole-house power, one entity per phase. Per-phase matters: the heat
  # pump and the car charger are balanced across all three, almost everything
  # else in a house is not, so the phases are what makes them separable.
  house_power_l1: sensor.gx_device_consumption_power_l1
  house_power_l2: sensor.gx_device_consumption_power_l2
  house_power_l3: sensor.gx_device_consumption_power_l3
  house_power_total: ""                           # only if you have no per-phase entities

  # Car charger status. Samples where it is charging are dropped from the
  # efficiency fit entirely, so its exact power never has to be known.
  ev_charging: binary_sensor.eh6nh5cd_charging

  # What the ESP32 reports it is actually driving the potentiometer to, 0..255
  # for an MCP41100. Without pump_outdoor_temp this is the only readback in the
  # chain: it says the write arrived, and - more useful - it says when the
  # hardware hit an end stop and clamped the value instead of applying it.
  pot_wiper: sensor.varmepump_proxy_mcp41100_wiper_0_255

  # Outputs. Every one you configure is written every cycle - they are the same
  # decision in different units, so the one you act on and the one you look at
  # cannot disagree.
  #
  # Two kinds of entity are accepted, and the difference matters:
  #
  #   input_number.* / number.*  a helper you define first (the shipped Home
  #                              Assistant package defines both of these). It
  #                              keeps its value across a restart, so this is
  #                              what the actuator should be driven from.
  #   sensor.*                   hpmpc creates it itself on the first cycle -
  #                              nothing to define, it just appears. But it
  #                              lives only in memory: a Home Assistant restart
  #                              forgets it until the next cycle, and it cannot
  #                              be renamed in the UI. Good for dashboards,
  #                              wrong for the control path.
  #
  # Mixing them is fine and often right: drive the resistor from the helper,
  # publish the rest as sensors so they need no YAML.
  #
  #   offset_output            the decision itself, in kelvin
  #   fake_temperature_output  real outdoor + offset: the temperature to show the
  #                            pump. Feed this to your resistor conversion in
  #                            Home Assistant, where you can calibrate the curve
  #                            against what the pump's display actually reads.
  #   resistance_output        ohm, converted here through the ntc: section below
  #   wiper_output             potentiometer step, through ntc: and pot: below.
  #                            Only if you want hpmpc to own both curves rather
  #                            than let the ESP32 do the conversion.
  offset_output: input_number.varmepump_offset
  fake_temperature_output: input_number.varmepump_fiktiv_utetemp
  resistance_output: ""
  wiper_output: ""
  # Example of a published one, needing no helper at all:
  #   resistance_output: sensor.hpmpc_target_resistance
  # Optional: the controller publishes its own status here.
  status_entity: sensor.hpmpc_status

site:
  address: Falkvagen, Norrkoping, Sverige
  # Run 'hpmpc geocode "Falkvagen, Norrkoping"' to pin these exactly. SMHI's
  # grid is about 2.5 km, so anywhere in Norrkoping gives the same forecast.
  latitude: 58.5877
  longitude: 16.1924
  elevation_m: 25
  timezone: Europe/Stockholm

forecast:
  weather_source: smhi              # SMHI open data: free, no key, ~10 days ahead
  price_source: elprisetjustnu      # Nord Pool day-ahead per bidding area, free, no key
  price_area: SE3
  weather_cache_minutes: 30         # SMHI updates hourly; be polite to a free service
  price_cache_minutes: 60
  timeout: 30

heat_pump:
  # Loads the bundled performance map: COP and capacity across the whole
  # envelope, plus the electric backup heater. Run 'hpmpc pump-table' to see
  # what it implies and compare against your databook.
  model: daikin_erlq016caw1
  efficiency_scale: 1.0             # refitted from your power sensor by 'hpmpc train'
  capacity_scale: 1.0

  # Daikin sets the weather-dependent curve as two endpoints. This example is
  # "40 C leaving water at -15 C outdoor, 25 C at +15 C outdoor", a typical
  # floor-heating curve. Convert your own with:
  #   hpmpc curve --point=-15:40 --point=15:25
  curve_slope: 0.50
  curve_offset: 22.5
  curve_ref: 20.0
  supply_min: 22.0
  supply_max: 40.0                  # floor heating: never let it plan above this
  loop_delta_t: 5.0
  outdoor_filter_hours: 3.0         # the pump's own outdoor averaging; refitted during training
  heat_stop_temp: 18.0              # space heating off above this filtered outdoor temperature

  # Absolute bounds on what the pump may be shown, independent of the offset.
  # Keeping the faked value inside the normal operating range avoids provoking
  # defrost logic or operating-limit behaviour that has nothing to do with the
  # heating curve.
  #
  # IMPORTANT: these have to be inside what your hardware can actually reach.
  # A single MCP41100 spans 0-100 kohm, which on the curve below bottoms out at
  # about -7 C. Ask for colder than that and the pot sits at its end stop, the
  # pump is shown -7 C on a -15 C day, and the house underheats with nothing in
  # the logs to say why. 'hpmpc ntc-table' prints the reachable band and
  # 'hpmpc check' compares it against these two numbers.
  perceived_min_c: -7.0
  perceived_max_c: 25.0

  standby_power_w: 40
  max_heat_output_w: 16000          # only used if heat_pump.model is empty
  carnot_efficiency: 0.43           # only used if heat_pump.model is empty
  cop_min: 1.0
  cop_max: 8.0
  defrost_penalty: 0.12

# The digital resistor. These values describe a TYPICAL Daikin 20 kohm outdoor
# thermistor. They are not measured on yours, so treat them as a starting point.
#
# What a wrong table actually costs, which is less than it looks:
#   - A smooth bias is largely absorbed. 'hpmpc train' fits the heating curve by
#     regressing measured supply temperature against the COMMANDED offset, so a
#     constant or linear error lands in curve_slope/curve_offset and the control
#     loop still predicts correctly.
#   - What is NOT absorbed is anything tied to an absolute threshold: the pump's
#     own heat_stop_temp, perceived_min_c/perceived_max_c, and holiday mode,
#     which works precisely by pushing the pump past its heating cut-off.
#
# So calibrate, and verify continuously with entities.pump_outdoor_temp above.
# The best calibration pairs are read off the pump's own display while you
# command a known resistance - not measured on the sensor with a multimeter,
# because the display includes the wiring, the connector and the pump's own
# curve. 'hpmpc check' prints a ready-made --point for the current resistance.
ntc:
  model: table
  table_temp_c: [-30, -25, -20, -15, -10, -5, 0, 5, 10, 15, 20, 25, 30]
  table_ohm:    [347667, 260639, 196648, 149283, 114003, 87562, 67628, 52514, 40991, 32159, 25354, 20084, 15984]
  r25: 20000                        # used only when model: beta
  beta: 3950
  resistance_min: 0
  resistance_max: 500000

# The digital potentiometer itself. Separate from ntc: on purpose - that one is
# the sensor curve you calibrate, this one is what the hardware can do, and
# recalibrating the curve must not silently change the hardware's limits.
#
# Devices in series add range, not resolution. One MCP41100 reaches -7 C at
# 0.10 K per step around freezing; two in series reach -20 C at the same step.
# Range is the binding constraint here, not resolution.
# What to buy for the second one: another MCP41100 - the same 100 kohm 8-bit
# SPI digital potentiometer, not a plain 100 ohm resistor. Wire it in series
# with the first (wiper and one end of each, so the two tracks add up), give it
# its own chip-select pin, and set devices: 2 below. Nothing else changes.
pot:
  model: mcp41100
  resistance_ohm: 100000            # end to end, one device
  steps: 256                        # tap positions, one device (8-bit)
  devices: 1                        # how many are wired in series
  wiper_ohm: 100                    # wiper resistance, present at every tap
  series_ohm: 0                     # a fixed resistor in series, if you fit one

control:
  offset_min: -6.0                  # more negative = pump thinks it is colder = more heat
  offset_max: 4.0
  max_change_per_cycle: 1.0         # kelvin per cycle; keeps the pump from hunting
  cycle_minutes: 15

  horizon_hours: 36                 # long enough to see through a whole price cycle
  step_minutes: 15
  block_hours: 3

  # The one number. Everything else about comfort is relative to it, so moving
  # the setpoint moves the whole band - there is no way to set 16 degrees and
  # leave a comfort band that still insists on 20.3.
  setpoint: 21.0
  comfort_below: 0.7                # the optimiser roams freely from setpoint-0.7 ...
  comfort_above: 1.0                # ... to setpoint+1.0
  hard_below: 2.0                   # and is heavily penalised outside setpoint-2.0 ...
  hard_above: 2.5                   # ... to setpoint+2.5

  weight_comfort: 40.0
  weight_hard: 400.0
  weight_offset_change: 0.05
  weight_terminal: 2.0
  weight_backup_heater: 0.0         # raise it to avoid resistive heat beyond its raw cost

  # Soft cap on total electrical input. A 16 kW compressor plus a 9 kW backup
  # heater will trip a 25 A service, and a preheat plan is exactly when they
  # would run together. Set this below your main fuse. 0 disables the cap.
  max_electric_power_kw: 0.0
  weight_power_limit: 25.0

  # Marginal cost = (spot * price_scale + price_addition) * (1 + price_vat_pct/100).
  # elprisetjustnu returns bare spot in SEK/kWh, so add transfer and energy tax
  # here, then VAT. Leaving these at zero makes the optimiser overestimate what
  # load shifting is worth.
  price_scale: 1.0
  price_addition: 0.7084            # grid transfer + energy tax, SEK/kWh, EXCLUDING VAT
  price_vat_pct: 25.0               # ... so VAT lands on the whole thing: 0.7084 * 1.25 = 0.8855

  # Warn when what the pump believes drifts from what was commanded, averaged
  # over many hours. Reported, never corrected: closing a feedback loop on an
  # actuator estimate would let one wrong entity walk the offset away quietly.
  actuator_error_warn_c: 1.5
  actuator_error_smoothing: 0.03    # about eight hours at a 15-minute cycle

  observer_gain: 1.0
  fallback_offset: 0.0              # used whenever sensors are missing or implausible
  max_data_age_minutes: 45
  warm_start_hours: 24
  dry_run: false                    # true = compute everything, write nothing

# Named comfort profiles. Selecting one replaces the setpoint (and optionally
# the band widths); because the band is relative, a holiday profile is one
# number and cannot leave the configuration self-contradictory.
modes:
  default: normal
  entity: input_select.varmepump_lage       # optional: a selector with the profile names
  holiday_entity: input_boolean.semesterlage  # the switch you reach for on the way out
  holiday_profile: holiday

  # When you are back. The comfort band returns to normal at that moment and
  # the optimiser - which plans 36 hours ahead - works out for itself when to
  # start reheating the slab and which hours to buy the heat in. With a ten-hour
  # slab time constant this is the difference between walking into a warm house
  # and waiting a day for one. Leave empty if you would rather flip the switch
  # manually when you set off home.
  return_entity: input_datetime.hemkomst
  return_ramp_hours: 2.0

  profiles:
    normal:
      setpoint: 21.0
    # Setback bands are deliberately lopsided. While nobody is home, too cold is
    # the only thing that matters; being warmer than the setback target costs
    # money and the price term already discourages it. A tight upper bound would
    # also forbid reheating the slab ahead of a return - which is the point.
    away:
      setpoint: 18.0
      comfort_below: 1.5
      comfort_above: 3.0
      hard_below: 3.0
      hard_above: 6.0
      offset_max: 15.0
    holiday:
      setpoint: 16.0
      comfort_below: 1.5
      comfort_above: 5.0
      hard_below: 3.0
      hard_above: 8.0
      # A deep setback needs far more authority than day-to-day trimming. The
      # heating curve is designed to hold 21 C, so coasting down to 16 C at
      # -6 C outdoors means showing the pump about +14 C - twenty kelvin of
      # offset, not four. heat_pump.perceived_max_c still caps the absolute
      # value the pump ever sees, and is what keeps this safe.
      offset_max: 25.0

# How to work out what the heat pump is drawing. Only relevant when there is no
# dedicated meter on the pump; see 'hpmpc power' to inspect the result.
power:
  source: auto                      # auto | heatpump_meter | house | none
  target: balanced                  # "balanced" uses 3 x min(phase), which is mostly the pump
  ev_guard_minutes: 15              # widen the charging mask; the sensor flips before the current does
  ev_nominal_kw: 11.0               # only a sanity check - the fit infers it independently
  base_harmonics: 4                 # smoothness of the daily base-load shape
  asymmetry: 1.0                    # < 1 tracks the lower envelope; biases efficiency upward
  huber_scale_w: 400                # above this, a residual is treated as an appliance, not an error
  validation_fraction: 0.25
  min_samples: 400

# Map settings to Home Assistant helper entities and change them from a
# dashboard - the controller picks up the new value on the next cycle. Run
# 'hpmpc settings' to see everything that can be mapped, and its allowed range.
runtime_overrides:
  control.price_addition: input_number.eloverforing_kr_per_kwh
  control.setpoint: input_number.inne_borvarde      # ignored while a non-default mode is active
  control.comfort_below: input_number.komfort_under
  control.comfort_above: input_number.komfort_over
  control.offset_min: input_number.offset_min
  control.offset_max: input_number.offset_max
  control.max_electric_power_kw: input_number.effekttak_kw
  control.weight_backup_heater: input_number.elpatron_avgift
  control.dry_run: input_boolean.hpmpc_dry_run

optimizer:
  population: 256
  elites: 26
  iterations: 12
  sigma_floor: 0.15
  seed: 0
  polish: true

training:
  history_days: 45
  resample_minutes: 15

  # Keep our own copy of the history, under data/history/.
  #
  # Home Assistant's recorder is a rolling window - ten days by default - and it
  # is purged on a schedule that belongs to another system. With this on, every
  # control cycle copies the recorder's new rows into data/history/, so recorder
  # retention only has to outlast the gap between two cycles instead of the six
  # weeks identification wants. A year of 15-minute rows is a few megabytes.
  #
  # 'hpmpc archive' shows what has been kept, and where the holes are.
  archive: true
  archive_keep_days: 400

  window_hours: 12                  # short windows pin the fast air dynamics
  window_stride_hours: 3
  burn_in_hours: 24                 # simulated but not scored; lets the slab estimate settle
  long_window_hours: 48             # long windows pin the slab, i.e. the storage capacity
  max_windows: 900
  validation_fraction: 0.25
  regularisation: 0.05
  restarts: 3
  use_residual_model: true
  residual_max_correction: 0.4      # K/h - hard cap on what the learned residual may do
  seed: 0

# The defaults are for running from a source checkout. In Docker the image sets
# HPMPC_DATA_DIR and friends to the mounted volume, so the same file works in
# both places without editing.
paths:
  data_dir: ${HPMPC_DATA_DIR:-data}
  model_dir: ${HPMPC_MODEL_DIR:-models}
  state_file: ${HPMPC_STATE_FILE:-data/controller_state.json}

server:
  host: 0.0.0.0
  port: 8129
  api_key: ${HPMPC_API_KEY:-}
